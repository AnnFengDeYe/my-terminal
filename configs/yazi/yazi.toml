# Minimal yazi config. Replace this with your own ~/.config/yazi directory
# by running scripts/import_existing_configs.sh on a machine with yazi config.

[manager]
show_hidden = false
sort_by = "natural"
sort_sensitive = false
sort_reverse = false

[preview]
# Increase the image preview cache bounds for high-resolution displays.
max_width = 1920
max_height = 1080

# Improve image preview quality.
image_quality = 90
