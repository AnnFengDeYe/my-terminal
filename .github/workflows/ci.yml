name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck tmux

      - name: Bash syntax check
        run: |
          bash -n setup.sh install.sh test_install.sh
          bash -n scripts/*.sh

      - name: ShellCheck
        run: |
          shellcheck --severity=warning -x setup.sh install.sh test_install.sh scripts/*.sh

      - name: Run install safety tests
        run: ./test_install.sh

      - name: Check help commands
        run: |
          ./setup.sh --help
          ./install.sh --help
          ./scripts/preview_install.sh --help
          ./scripts/showcase_layout.sh --help
          ./scripts/workspace_layout.sh --help

      - name: Check README assets
        run: test -f assets/workspace-layout.jpg

      - name: Tmux layout smoke tests
        env:
          TERM: xterm-256color
          WORKSPACE_COLS: 120
          WORKSPACE_LINES: 36
          SHOWCASE_COLS: 120
          SHOWCASE_LINES: 36
        run: |
          cleanup() {
            tmux kill-session -t ci-workspace 2>/dev/null || true
            tmux kill-session -t ci-showcase 2>/dev/null || true
          }
          trap cleanup EXIT

          WORKSPACE_COLS=80 WORKSPACE_LINES=24 ./scripts/workspace_layout.sh --session ci-workspace --reset --no-attach
          ./scripts/workspace_layout.sh --session ci-workspace --no-attach
          test "$(tmux display-message -p -t ci-workspace:1 '#{window_width}x#{window_height}')" = "120x36"
          test "$(tmux display-message -p -t ci-workspace:2 '#{window_width}x#{window_height}')" = "120x36"
          test "$(tmux display-message -p -t ci-workspace:3 '#{window_width}x#{window_height}')" = "120x36"
          test "$(tmux show-options -t ci-workspace -qv window-size)" = "latest"
          test "$(tmux show-window-options -t ci-workspace:2 -v aggressive-resize)" = "on"
          test "$(tmux show-window-options -t ci-workspace:3 -v aggressive-resize)" = "on"
          test "$(tmux show-window-options -t ci-workspace:4 -v aggressive-resize)" = "on"
          test "$(tmux list-panes -t ci-workspace:1 -F '#{pane_title} #{pane_width} #{pane_height}' | awk '$1 == "nvim" { print ($2 >= 70 && $3 >= 20) ? "ok" : "bad" }')" = "ok"
          test "$(tmux list-panes -t ci-workspace:1 -F '#{pane_title} #{pane_width} #{pane_height}' | awk '$1 == "yazi" { print ($2 >= 40 && $3 >= 15) ? "ok" : "bad" }')" = "ok"
          test "$(tmux list-windows -t ci-workspace | wc -l | tr -d ' ')" = "4"
          test "$(tmux list-panes -t ci-workspace:1 | wc -l | tr -d ' ')" = "4"
          test "$(tmux list-panes -t ci-workspace:2 | wc -l | tr -d ' ')" = "2"
          test "$(tmux list-panes -t ci-workspace:3 | wc -l | tr -d ' ')" = "4"
          test "$(tmux list-panes -t ci-workspace:2 -F '#{pane_title}' | tr '\n' ' ')" = "agent-1 agent-2 "
          test "$(tmux list-panes -t ci-workspace:3 -F '#{pane_title}' | tr '\n' ' ')" = "ssh-1 ssh-3 ssh-2 ssh-4 "
          tmux show-hooks -t ci-workspace client-resized | grep -q -- '--fit-only'
          tmux show-hooks -t ci-workspace after-select-window | grep -q -- '--fit-only'

          ./scripts/showcase_layout.sh --session ci-showcase --reset --no-attach
          test "$(tmux list-windows -t ci-showcase | wc -l | tr -d ' ')" = "4"
          test "$(tmux list-panes -t ci-showcase:1 | wc -l | tr -d ' ')" = "4"
