name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh

      - name: Set up Go for Actionlint
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Bash syntax check
        run: |
          bash -n setup.sh install.sh test_install.sh test_workspace.sh
          bash -n scripts/*.sh

      - name: Zsh syntax check
        run: |
          zsh -n configs/zsh/zshenv
          zsh -n configs/zsh/zprofile
          zsh -n configs/zsh/zshrc

      - name: ShellCheck
        run: |
          shellcheck --severity=warning -x setup.sh install.sh test_install.sh test_workspace.sh scripts/*.sh

      - name: Actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  test:
    # macOS ships bash 3.2 and BSD userland; Linux ships GNU userland and a
    # different tmux. The scripts have to work on both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y file tmux zsh

      - name: Install test dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tmux

      - name: Run install safety tests
        run: ./test_install.sh

      - name: Check help commands
        run: |
          ./setup.sh --help
          ./install.sh --help
          ./scripts/doctor.sh --help
          ./scripts/preview_install.sh --help
          ./scripts/install_command_shims.sh --help
          ./scripts/showcase_layout.sh --help
          ./scripts/workspace_layout.sh --help
          ./scripts/workplace_manual.sh --help

      - name: Check workplace manual
        run: |
          ./scripts/workplace_manual.sh --check
          ./scripts/workplace_manual.sh --list | grep -q '^ll[[:space:]]'
          ./scripts/workplace_manual.sh --list | grep -q '^rgc[[:space:]]'
          ./scripts/workplace_manual.sh --query tmux | grep -q '^tls[[:space:]]'
          ./scripts/workplace_manual.sh --query branch | grep -q '^gsw[[:space:]]'
          ./scripts/workplace_manual.sh --show workplace | grep -q 'workspace_layout.sh'

      - name: Check README assets
        run: |
          set -euo pipefail

          test -s assets/workspace-layout.jpg
          file assets/workspace-layout.jpg | grep -q 'JPEG image data'

          image_refs="$(grep -hEo '!\[[^]]*\]\(assets/[^)]+\)' README.md README.en.md | sed -E 's/^!\[[^]]*\]\((assets\/[^)]+)\)$/\1/')"
          test -n "$image_refs"
          printf '%s\n' "$image_refs" | while IFS= read -r asset; do
            test -s "$asset"
          done

      - name: Workspace tests
        env:
          TERM: xterm-256color
        run: ./test_workspace.sh
