name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck tmux

      - name: Bash syntax check
        run: |
          bash -n setup.sh install.sh test_install.sh
          bash -n scripts/*.sh

      - name: ShellCheck
        run: |
          shellcheck --severity=warning -x setup.sh install.sh test_install.sh scripts/*.sh

      - name: Run install safety tests
        run: ./test_install.sh

      - name: Check help commands
        run: |
          ./setup.sh --help
          ./install.sh --help
          ./scripts/preview_install.sh --help
          ./scripts/showcase_layout.sh --help
          ./scripts/workspace_layout.sh --help
          ./scripts/workplace_manual.sh --help

      - name: Check workplace manual
        run: |
          ./scripts/workplace_manual.sh --list | grep -q '^ll[[:space:]]'
          ./scripts/workplace_manual.sh --list | grep -q '^rgc[[:space:]]'
          ./scripts/workplace_manual.sh --query tmux | grep -q '^tls[[:space:]]'
          ./scripts/workplace_manual.sh --query branch | grep -q '^gsw[[:space:]]'
          ./scripts/workplace_manual.sh --show workplace | grep -q 'workspace_layout.sh'

      - name: Check README assets
        run: test -f assets/workspace-layout.jpg

      - name: Tmux layout smoke tests
        env:
          TERM: xterm-256color
          WORKSPACE_COLS: 120
          WORKSPACE_LINES: 36
          SHOWCASE_COLS: 120
          SHOWCASE_LINES: 36
        run: |
          cleanup() {
            tmux kill-session -t ci-workspace 2>/dev/null || true
            tmux kill-session -t ci-showcase 2>/dev/null || true
          }
          trap cleanup EXIT

          workspace_manifest="$(./scripts/workspace_layout.sh --list-windows)"
          expected_workspace_windows="$(printf '%s\n' "$workspace_manifest" | awk -F: '{ printf "%s:%s ", $1, $2 }')"
          expected_workspace_count="$(printf '%s\n' "$workspace_manifest" | wc -l | tr -d ' ')"
          primary_window="$(printf '%s\n' "$workspace_manifest" | awk -F: '$3 == "primary" { print $2; exit }')"
          primary_entry_pane="$(printf '%s\n' "$workspace_manifest" | awk -F: '$3 == "primary" { print $4; exit }')"

          WORKSPACE_COLS=80 WORKSPACE_LINES=24 ./scripts/workspace_layout.sh --session ci-workspace --reset --no-attach
          ./scripts/workspace_layout.sh --session ci-workspace --no-attach
          test "$(tmux display-message -p -t "ci-workspace:$primary_window" '#{pane_title}')" = "$primary_entry_pane"
          test "$(tmux show-options -t ci-workspace -qv window-size)" = "latest"
          while IFS=: read -r index window_name role entry_pane initial_pane configure_fn fit_fn; do
            test "$(tmux display-message -p -t "ci-workspace:$window_name" '#{window_width}x#{window_height}')" = "120x36"
            test "$(tmux show-window-options -t "ci-workspace:$window_name" -v aggressive-resize)" = "on"
          done <<< "$workspace_manifest"
          test "$(tmux list-panes -t ci-workspace:dev -F '#{@workspace_pane_role} #{pane_width} #{pane_height}' | awk '$1 == "editor" { print ($2 >= 70 && $3 >= 20) ? "ok" : "bad" }')" = "ok"
          test "$(tmux list-panes -t ci-workspace:dev -F '#{@workspace_pane_role} #{pane_width} #{pane_height}' | awk '$1 == "files" { print ($2 >= 40 && $3 >= 15) ? "ok" : "bad" }')" = "ok"
          test "$(tmux list-windows -t ci-workspace | wc -l | tr -d ' ')" = "$expected_workspace_count"
          test "$(tmux list-windows -t ci-workspace -F '#I:#W' | tr '\n' ' ')" = "$expected_workspace_windows"
          test "$(tmux list-panes -t ci-workspace:dev | wc -l | tr -d ' ')" = "4"
          test "$(tmux list-panes -t ci-workspace:agent | wc -l | tr -d ' ')" = "2"
          test "$(tmux list-panes -t ci-workspace:ssh | wc -l | tr -d ' ')" = "4"
          test "$(tmux list-panes -t ci-workspace:logs | wc -l | tr -d ' ')" = "2"
          test "$(tmux list-panes -t ci-workspace:btop | wc -l | tr -d ' ')" = "1"
          test "$(tmux list-panes -t ci-workspace:manual | wc -l | tr -d ' ')" = "1"
          test "$(tmux list-panes -t ci-workspace:agent -F '#{@workspace_pane_role}' | tr '\n' ' ')" = "agent-1 agent-2 "
          test "$(tmux list-panes -t ci-workspace:ssh -F '#{@workspace_pane_role}' | tr '\n' ' ')" = "ssh-1 ssh-3 ssh-2 ssh-4 "
          test "$(tmux list-panes -t ci-workspace:logs -F '#{@workspace_pane_role}' | tr '\n' ' ')" = "logs-1 logs-2 "
          test "$(tmux list-panes -t ci-workspace:btop -F '#{@workspace_pane_role}' | tr '\n' ' ')" = "monitor "
          test "$(tmux list-panes -t ci-workspace:manual -F '#{@workspace_pane_role}' | tr '\n' ' ')" = "manual "
          tmux show-hooks -t ci-workspace client-resized | grep -q -- '--fit-only'
          tmux show-hooks -t ci-workspace after-select-window | grep -q -- '--fit-only'

          ./scripts/showcase_layout.sh --session ci-showcase --reset --no-attach
          test "$(tmux list-windows -t ci-showcase | wc -l | tr -d ' ')" = "4"
          test "$(tmux list-panes -t ci-showcase:1 | wc -l | tr -d ' ')" = "4"
